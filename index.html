<script>
const giftTexts=['Вечер любимого кино с какао и пледом — твой подарок себе сегодня.','Купон на час отдыха без забот. Посвяти его только себе.','Сладкий сюрприз: порадуй себя любимым десертом.','Твой подарок — прогулка среди праздничных огней.','Устрой уютный завтрак с любимой музыкой.','Разреши себе день без спешки. Самое время выдохнуть.','Выбери маленькое украшение на ёлку на память об этом годе.','Подари себе тёплую ванну или домашний спа-вечер.','Сегодня можно перечитать любимую сказку.','Чашка ароматного чая и 20 минут тишины уже ждут тебя.','Устрой вечер настольных игр с близкими.','Подарок для настроения: составь свой праздничный плейлист.','Сделай себе красивое фото на фоне новогодних огней.','Побалуй себя любимым фруктом или зимним угощением.','Сегодня твой вечер танцев под любимые песни.','Посмотри на старые счастливые фотографии и улыбнись.','Пусть сегодня тебя ждёт неспешная прогулка в любимом месте.','Напиши себе доброе письмо и сохрани его до следующей зимы.','Выбери время для хобби, которое давно откладывалось.','Главный подарок — ты и всё хорошее, что впереди. Загадай желание!'];
const taskTexts=['Напиши три вещи, за которые благодаришь уходящий год.','Отправь близкому человеку тёплое сообщение.','Вырежи бумажную снежинку и укрась ею окно.','Придумай одно доброе дело и сделай его сегодня.','Вспомни самое смешное событие года и расскажи о нём.','Нарисуй свою идеальную новогоднюю ёлку.','Сфотографируй что-нибудь, что создаёт праздничное настроение.','Назови пять маленьких радостей этой зимы.','Сделай комплимент человеку рядом с тобой.','Запиши мечту, которую хочешь исполнить в новом году.','Наведи уют в одном маленьком уголке дома.','Выучи или вспомни короткое новогоднее стихотворение.','Позвони человеку, с которым давно не разговаривал.','Придумай необычное название для наступающего года.','Сделай новогоднюю открытку своими руками.','Включи любимую песню и потанцуй одну минуту.','Запиши три вещи, которыми гордишься в этом году.','Расскажи близким о своей любимой новогодней традиции.','Пожелай что-нибудь хорошее трём разным людям.','Заверши фразу: «В новом году я хочу больше…»'];
const key='winter-windows-v1';let opened=new Set(),soundOn=false,ctx;try{const data=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(data))opened=new Set(data.filter(n=>Number.isInteger(n)&&n>=0&&n<40));soundOn=false}catch{}const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(key,JSON.stringify([...opened]));localStorage.setItem(key+'-sound',String(soundOn))}catch{ $('hint').textContent='Браузер не разрешает сохранение. Прогресс доступен до перезагрузки страницы.'}}
function tone(){if(!soundOn)return;try{ctx ||= new (window.AudioContext||window.webkitAudioContext)();ctx.resume();[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain(),t=ctx.currentTime+i*.11;osc.type='sine';osc.frequency.value=f;gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.12,t+.015);gain.gain.exponentialRampToValueAtTime(.001,t+.6);osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+.65)})}catch{soundOn=false;updateSound();$('hint').textContent='Звук недоступен в этом браузере.'}}
function updateSound(){$('greeting').muted=!soundOn;$('sound').textContent=soundOn?'♫ Звук включён':'♫ Звук выключен';$('sound').setAttribute('aria-pressed',String(soundOn));if(!$('greeting').paused)$('video-status').textContent=soundOn?'Слушай приветствие героя':'Видео без звука · включи звук кнопкой сверху'}
function render(){let gifts=[...opened].filter(i=>i%2===0).length;$('gifts').textContent=gifts;$('progress-text').textContent=`Открыто ${opened.size} из 40 окошек`;$('percent').textContent=`${Math.round(opened.size/40*100)}%`;$('fill').style.width=opened.size/40*100+'%';document.querySelector('.track').setAttribute('aria-valuenow',opened.size);$('grid').replaceChildren();for(let i=0;i<40;i++){let gift=i%2===0,done=opened.has(i),b=document.createElement('button');b.className='window'+(gift?'':' task')+(done?' opened':'');b.setAttribute('aria-label',`Окошко ${i+1}: ${gift?'подарок':'задание'}${done?', уже открыто':''}`);b.innerHTML=`<span class="number">${String(i+1).padStart(2,'0')}</span><span class="present" aria-hidden="true"><img class="gift-image" src="${done?'assets/Открытая коралловая коробка с золотым бантом-2.png':'assets/Коралловая коробка с золотым бантом-1.png'}" alt="" draggable="false"></span><span class="tiny">${done?'ОТКРЫТО':gift?'ПОДАРОК':'ЗАДАНИЕ'}</span>`;b.onclick=()=>openWindow(i);$('grid').append(b)}}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<25;i++){let e=document.createElement('span');e.className='confetti';e.textContent=['✦','❄','•'][i%3];e.style.left=Math.random()*100+'vw';e.style.color=['#e9c783','#fff','#96bba5'][i%3];e.style.animationDelay=Math.random()*.4+'s';document.body.append(e);setTimeout(()=>e.remove(),3000)}}
function openWindow(i){if($('modal').open)return;const fresh=!opened.has(i),gift=i%2===0;opened.add(i);save();render();$('modal-icon').textContent=gift?'🎁':'✉️';$('modal-kicker').textContent=`ОКОШКО ${i+1} · ${gift?'ПОДАРОК':'ЗАДАНИЕ'}`;$('modal-title').textContent=gift?'Маленькая радость для тебя':'Добавим немного волшебства';$('modal-text').textContent=(gift?giftTexts:taskTexts)[Math.floor(i/2)];$('modal').showModal();if(fresh){tone();if(gift)confetti()}if(opened.size===40)$('hint').textContent='✦ Все 40 окошек открыты! Пусть волшебство останется с тобой.'}
const video=$('greeting'),playButton=$('play-video');video.loop=false;playButton.onclick=async()=>{if(video.paused){if(video.ended)video.currentTime=0;try{await video.play()}catch{$('video-status').textContent='Не удалось запустить видео. Попробуй нажать ещё раз.'}}else video.pause()};video.addEventListener('play',()=>{playButton.textContent='Ⅱ Пауза';$('video-status').textContent=soundOn?'Слушай приветствие героя':'Видео без звука · включи звук кнопкой сверху'});video.addEventListener('pause',()=>{playButton.textContent=video.ended?'↻ Посмотреть ещё раз':'▶ Продолжить приветствие'});video.addEventListener('ended',()=>{playButton.textContent='↻ Посмотреть ещё раз';$('video-status').textContent='А теперь выбирай подарок справа!'});video.addEventListener('error',()=>{$('video-status').textContent='Видео не загрузилось. Подарки по-прежнему можно открывать.'});
$('sound').onclick=()=>{soundOn=!soundOn;if(!soundOn&&ctx)ctx.suspend().catch(()=>{});updateSound();save();if(soundOn)tone()};$('close').onclick=()=>$('modal').close();$('modal').onclick=e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('modal').close()}};function resetGame(){if(!confirm('Открыть все окошки заново? Текущий прогресс будет сброшен.'))return;video.pause();video.currentTime=0;if(ctx){const old=ctx;ctx=undefined;old.close().catch(()=>{})}document.querySelectorAll('.confetti').forEach(e=>e.remove());if($('modal').open)$('modal').close();opened.clear();save();render();$('hint').textContent='✧ Открывай в любом порядке. У каждого окошка своя маленькая история.';video.play().catch(()=>{$('video-status').textContent='Нажми, чтобы запустить приветствие';playButton.textContent='▶ Смотреть приветствие'})} $('reset').onclick=resetGame;$('modal-reset').onclick=resetGame;render();updateSound();video.play().catch(()=>{$('video-status').textContent='Нажми, чтобы запустить приветствие';playButton.textContent='▶ Смотреть приветствие'});if(opened.size===40)$('hint').textContent='✦ Все 40 окошек открыты! Пусть волшебство останется с тобой.';
</script></body></html>
